name: Build Debug APK

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK manually
        run: |
          SDK=$ANDROID_SDK_ROOT
          CMDLINE=$SDK/cmdline-tools/latest/bin/sdkmanager

          echo "=== Accept all SDK licenses ==="
          yes | $CMDLINE --licenses || true

          echo "=== Install only required packages ==="
          yes | $CMDLINE \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true

          echo "=== Installed packages ==="
          $CMDLINE --list_installed || true

          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: Find project root
        id: root
        run: |
          if [ -f "project_src/finddiff2/gradlew" ]; then
            echo "root=project_src/finddiff2" >> "$GITHUB_OUTPUT"
          elif [ -f "finddiff2/gradlew" ]; then
            echo "root=finddiff2" >> "$GITHUB_OUTPUT"
          elif [ -f "project_src/gradlew" ]; then
            echo "root=project_src" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi

      - name: Show root
        run: echo "Project root = ${{ steps.root.outputs.root }}"

      - name: Fix gradlew
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          chmod +x gradlew || true
          chmod +x gradle/wrapper/gradle-wrapper.jar || true

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: List outputs
        run: |
          echo "ROOT=${{ steps.root.outputs.root }}"
          find "${{ steps.root.outputs.root }}" -name "*debug*.apk" -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.root.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
