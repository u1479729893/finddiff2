name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          mkdir -p project_src
          if [ -f app_source.zip ]; then
            unzip -q -o app_source.zip -d project_src
          else
            echo "app_source.zip not found"
            exit 1
          fi

      - name: Find project root
        id: root
        run: |
          set -e
          cd project_src
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "root=project_src" >> $GITHUB_OUTPUT
          elif [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            echo "root=project_src" >> $GITHUB_OUTPUT
          else
            ROOT=$(find . -maxdepth 3 -name 'settings.gradle' -o -name 'settings.gradle.kts' | head -n 1 | xargs dirname)
            if [ -z "$ROOT" ]; then
              echo "Cannot find Gradle project root"
              exit 1
            fi
            echo "root=${ROOT#./}" >> $GITHUB_OUTPUT
          fi
          echo "PROJECT_ROOT=${{ steps.root.outputs.root }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK manually
        run: |
          set -e
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"

          cd "$SDK/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q -o tools.zip

          if [ -d cmdline-tools ]; then
            rm -rf latest
            mv cmdline-tools latest
          fi

          ls -la latest/bin

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "=== INSTALLED PACKAGES ==="
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed

          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: Fix gradlew and permissions
        working-directory: project_src/${{ steps.root.outputs.root }}
        run: |
          set -e
          if [ ! -f gradlew ]; then
            echo "No gradlew found, generating wrapper..."
            gradle wrapper || ./gradlew wrapper || true
          fi
          chmod +x gradlew || true
          chmod +x gradle/wrapper/gradle-wrapper.jar || true

      - name: Build debug APK
        working-directory: project_src/${{ steps.root.outputs.root }}
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            project_src/${{ steps.root.outputs.root }}/**/build/outputs/apk/debug/*.apk
            project_src/${{ steps.root.outputs.root }}/**/build/outputs/apk/*/debug/*.apk
