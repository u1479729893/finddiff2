name: Build FindDiff APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p unzipped
          ZIP=$(find . -maxdepth 2 -iname "FindDiffOverlay2.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No FindDiffOverlay2.zip found"; exit 1
          fi
          unzip -o "$ZIP" -d ./unzipped
          echo "=== UNZIPPED TREE ==="
          find ./unzipped -maxdepth 6 -print | head -n 400

      - name: Find project root
        id: root
        run: |
          if [ -f "./unzipped/settings.gradle" ] || [ -f "./unzipped/settings.gradle.kts" ]; then
            PROJECT_DIR="./unzipped"
          else
            D=$(find ./unzipped -maxdepth 6 -iname "settings.gradle*" | head -n 1 | xargs dirname)
            if [ -z "$D" ]; then
              echo "ERROR: settings.gradle not found"
              find ./unzipped -maxdepth 6 -print | head -n 300
              exit 1
            fi
            PROJECT_DIR="$D"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          echo "=== gradlew check ==="
          ls -la "$PROJECT_DIR/gradlew" || echo "NO gradlew file"
          file "$PROJECT_DIR/gradlew" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: false

      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.7
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          mkdir -p /opt/gradle
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          gradle --version

      - name: Fix gradlew line endings
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
            echo "Fixed gradlew"
          else
            echo "No gradlew, will use installed gradle"
          fi

      - name: Build debug APK (gradlew if present, else gradle)
        working-directory: ${{ steps.root.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x ./gradlew ]; then
            echo "Using gradlew"
            ./gradlew assembleDebug --no-daemon
          else
            echo "Using installed gradle"
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindDiff-debug-apk
          path: ${{ steps.root.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
