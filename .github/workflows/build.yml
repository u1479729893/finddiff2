name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Find gradlew
        id: gw
        run: |
          GW=$(find . -maxdepth 5 -name gradlew | head -n 1)
          if [ -z "$GW" ]; then
            echo "ERROR: gradlew not found!"
            echo "Repo tree:"
            ls -R | head -n 300
            exit 1
          fi

          ROOT=$(dirname "$GW")
          echo "Found gradlew at: $GW"
          echo "Project root: $ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "gw=$GW" >> "$GITHUB_OUTPUT"

      - name: Prepare gradlew permissions
        run: |
          chmod +x "${{ steps.gw.outputs.gw }}"
          chmod +x "${{ steps.gw.outputs.root }}/gradle/wrapper/gradle-wrapper.jar" || true

      - name: Clean gradle cache
        run: |
          rm -rf ~/.gradle/caches ~/.gradle/wrapper || true

      - name: Build debug APK
        working-directory: ${{ steps.gw.outputs.root }}
        timeout-minutes: 30
        run: |
          ./gradlew --no-daemon --refresh-dependencies --stacktrace assembleDebug

      - name: List outputs
        run: |
          echo "ROOT=${{ steps.gw.outputs.root }}"
          find "${{ steps.gw.outputs.root }}" -name "*.apk" -o -name "*.aab" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.gw.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
