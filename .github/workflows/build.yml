name: Build FindDiff APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ZIP FILES ==="
          find . -maxdepth 3 -iname "*.zip" -ls
          echo "=== GRADLEW FILES ==="
          find . -maxdepth 6 -name "gradlew" -ls

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname "FindDiffOverlay2.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -o "$ZIP" -d .
            rm -f "$ZIP"
          else
            echo "No FindDiffOverlay2.zip found"
          fi

          echo "=== AFTER UNZIP ==="
          ls -la

      - name: Find project root
        id: root
        run: |
          GW=$(find . -maxdepth 6 -name "gradlew" | grep -v "/build/" | head -n 1)
          if [ -z "$GW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found gradlew at $GW"
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK manually
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip

          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindDiff-debug-apk
          path: ${{ steps.root.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
