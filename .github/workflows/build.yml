name: Build FindDiff APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ZIP FILES ==="
          find . -maxdepth 3 -iname "*.zip" -ls

      - name: Unzip project
        run: |
          mkdir -p unzipped
          ZIP=$(find . -maxdepth 2 -iname "FindDiffOverlay2.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No FindDiffOverlay2.zip found"
            exit 1
          fi

          echo "Unzipping $ZIP into ./unzipped"
          unzip -o "$ZIP" -d ./unzipped

          echo "=== UNZIPPED TOP ==="
          ls -la ./unzipped

          echo "=== UNZIPPED TREE ==="
          find ./unzipped -maxdepth 6 -print | head -n 400

      - name: Find project root
        id: root
        run: |
          if [ -f "./unzipped/settings.gradle" ] || [ -f "./unzipped/settings.gradle.kts" ]; then
            PROJECT_DIR="./unzipped"
          else
            D=$(find ./unzipped -maxdepth 6 -iname "settings.gradle*" | head -n 1 | xargs dirname)
            if [ -z "$D" ]; then
              echo "ERROR: settings.gradle not found"
              find ./unzipped -maxdepth 6 -print | head -n 300
              exit 1
            fi
            PROJECT_DIR="$D"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK manually
        run: |
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools/latest"
          cd "$SDK/cmdline-tools"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip

          # GitHub runner 自带目录有时会是 cmdline-tools/cmdline-tools，整理一下
          if [ -d cmdline-tools ]; then
            mv cmdline-tools/* latest/
            rm -rf cmdline-tools
          else
            mv bin lib NOTICE.txt source.properties latest/ 2>/dev/null || true
          fi

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "=== INSTALLED PACKAGES ==="
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Fix gradlew and permissions
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
            echo "gradlew fixed"
          else
            echo "No gradlew found"
          fi

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x ./gradlew ]; then
            echo "Build with gradlew"
            ./gradlew assembleDebug --no-daemon
          else
            echo "No gradlew, installing gradle"
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            mkdir -p /opt/gradle
            unzip -q /tmp/gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FindDiff-debug-apk
          path: |
            ${{ steps.root.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.root.outputs.project_dir }}/*/build/outputs/apk/debug/*.apk
