name: Build FindDiff APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ZIP FILES ==="
          find . -maxdepth 3 -iname "*.zip" -ls

      - name: Unzip project
        run: |
          mkdir -p unzipped
          ZIP=$(find . -maxdepth 2 -iname "FindDiffOverlay2.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No FindDiffOverlay2.zip found"
            exit 1
          fi

          echo "Unzipping $ZIP into ./unzipped"
          unzip -o "$ZIP" -d ./unzipped

          echo "=== UNZIPPED TOP ==="
          ls -la ./unzipped

          echo "=== UNZIPPED TREE ==="
          find ./unzipped -maxdepth 6 -print | head -n 400

      - name: Find project root
        id: root
        run: |
          echo "=== SEARCH SETTINGS.GRADLE ==="
          find ./unzipped -maxdepth 6 -iname "settings.gradle*" -print

          if [ -f "./unzipped/settings.gradle" ] || [ -f "./unzipped/settings.gradle.kts" ]; then
            PROJECT_DIR="./unzipped"
          else
            D=$(find ./unzipped -maxdepth 6 -iname "settings.gradle*" | head -n 1 | xargs dirname)
            if [ -z "$D" ]; then
              echo "ERROR: settings.gradle not found"
              find ./unzipped -maxdepth 6 -print | head -n 300
              exit 1
            fi
            PROJECT_DIR="$D"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          echo "=== gradlew check ==="
          ls -la "$PROJECT_DIR/gradlew" || echo "NO gradlew file"
          file "$PROJECT_DIR/gradlew" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Fix gradlew and permissions
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
            echo "gradlew fixed"
          else
            echo "No gradlew found, will try system gradle later if needed"
          fi

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          if [ -x ./gradlew ]; then
            echo "Build with gradlew"
            ./gradlew assembleDebug --no-daemon
          else
            echo "Build with system gradle"
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FindDiff-debug-apk
          path: |
            ${{ steps.root.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.root.outputs.project_dir }}/*/build/outputs/apk/debug/*.apk
