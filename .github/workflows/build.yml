name: Build FindDiff APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ZIP FILES ==="
          find . -maxdepth 3 -iname "*.zip" -ls

      - name: Unzip project
        run: |
          mkdir -p unzipped
          ZIP=$(find . -maxdepth 2 -iname "FindDiffOverlay2.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No FindDiffOverlay2.zip found"
            exit 1
          fi

          echo "Unzipping $ZIP into ./unzipped"
          unzip -o "$ZIP" -d ./unzipped

          echo "=== UNZIPPED TOP ==="
          ls -la ./unzipped

          echo "=== UNZIPPED TREE ==="
          find ./unzipped -maxdepth 5 -print | head -n 300

      - name: Find project root
        id: root
        run: |
          echo "=== SEARCH GRADLEW ==="
          find ./unzipped -maxdepth 6 -name "gradlew" -print

          echo "=== SEARCH SETTINGS.GRADLE ==="
          find ./unzipped -maxdepth 6 -iname "settings.gradle*" -print

          # 如果根目录直接有 gradlew
          if [ -f "./unzipped/gradlew" ]; then
            PROJECT_DIR="./unzipped"
          else
            # 否则找第一个 gradlew，取其目录
            GW=$(find ./unzipped -maxdepth 6 -name "gradlew" | grep -v "/build/" | head -n 1)
            if [ -z "$GW" ]; then
              echo "ERROR: gradlew not found inside unzipped/"
              find ./unzipped -maxdepth 6 -print | head -n 300
              exit 1
            fi
            PROJECT_DIR=$(dirname "$GW")
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: false

      - name: Make gradlew executable
        working-directory: ${{ steps.root.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.project_dir }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FindDiff-debug-apk
          path: ${{ steps.root.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
