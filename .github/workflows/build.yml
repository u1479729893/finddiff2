name: Build Debug APK

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK manually
        run: |
          SDK=$ANDROID_SDK_ROOT
          CMDLINE=$SDK/cmdline-tools/latest/bin/sdkmanager

          echo "=== Accept all SDK licenses ==="
          yes | $CMDLINE --licenses || true

          echo "=== Install only required packages ==="
          yes | $CMDLINE \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true

          echo "=== Installed packages ==="
          $CMDLINE --list_installed || true

          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: Find gradlew
        id: gw
        run: |
          echo "Searching for gradlew..."
          GW=$(find . -maxdepth 5 -name gradlew -type f | head -n 1)

          if [ -z "$GW" ]; then
            echo "ERROR: gradlew not found!"
            echo "Repo tree:"
            ls -R | head -n 200
            exit 1
          fi

          ROOT=$(dirname "$GW")
          echo "Found gradlew at: $GW"
          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "gw=$GW" >> "$GITHUB_OUTPUT"

          chmod +x "$GW"
          chmod +x "$ROOT/gradle/wrapper/gradle-wrapper.jar" || true

      - name: Build debug APK
        working-directory: ${{ steps.gw.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: List outputs
        run: |
          echo "ROOT=${{ steps.gw.outputs.root }}"
          find "${{ steps.gw.outputs.root }}" -name "*debug*.apk" -ls || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.gw.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
